services:
  user-emu:
    build:
      context: ./user-emu
    image: iot-vulhub/dir815-user:latest
    volumes:
      - ./squashfs-root:/rootfs:ro
      - ./user-emu/run.sh:/env/run.sh:ro
    environment:
      ARCH: ${ARCH:-mipsel}
      ROOTFS: /rootfs
      # hedwig.cgi 是 cgibin 里的虚拟入口,不是文件
      ENTRY: ${ENTRY:-/hedwig.cgi}
      MODE: ${MODE:-run}
      LEN: ${LEN:-1038}
      PAYLOAD: ${PAYLOAD:-}
    ports:
      - "6666:6666"
    tty: true
    stdin_open: true
