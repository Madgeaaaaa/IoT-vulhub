services:
  firmae:
    build:
      context: ./firmae
    image: iot-vulhub/dir815-firmae:latest
    # FirmAE 需要建 tap 设备、改 iptables,必须 privileged + host 网络
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /opt/FirmAE
    volumes:
      - ./firmware:/firmware:ro
      - ./firmae/scratch:/opt/FirmAE/scratch
    environment:
      BRAND: ${BRAND:-dlink}
      # 注意:这是容器内路径,不是宿主机路径
      FW: ${FW_CONTAINER:-/firmware/DIR815A1_FW103b01.bin}
      MODE: ${MODE:-r}
    command: ["/bin/bash"]
